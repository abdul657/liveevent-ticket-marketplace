services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liveevent
      POSTGRES_USER: liveevent
      POSTGRES_PASSWORD: liveevent_dev
    ports:
      - "5432:5432"
    volumes:
      - liveevent-postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liveevent -d liveevent"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://liveevent:liveevent_dev@db:5432/liveevent
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on: [api]
volumes:
  liveevent-postgres:
